<!-- Brand kit v2 §04: fixed squircle frame + bright accent background + one dark
     silhouette. Blip's glyph is the board itself — a 3×3 of tiles with one of
     them blown up mid-tap. The whole game in a single mark: a grid, and the
     one cell that wants you right now. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64" fill="none">
  <rect width="64" height="64" rx="15" fill="#1DC0ED"/>
  <g fill="#15141B">
    <rect x="8"  y="8"  width="12" height="12" rx="3.8"/>
    <rect x="26" y="8"  width="12" height="12" rx="3.8"/>
    <rect x="44" y="8"  width="12" height="12" rx="3.8"/>
    <rect x="8"  y="26" width="12" height="12" rx="3.8"/>
    <rect x="44" y="26" width="12" height="12" rx="3.8"/>
    <rect x="8"  y="44" width="12" height="12" rx="3.8"/>
    <rect x="26" y="44" width="12" height="12" rx="3.8"/>
    <rect x="44" y="44" width="12" height="12" rx="3.8"/>
    <rect x="22" y="22" width="20" height="20" rx="6.4"/>
  </g>
</svg>
